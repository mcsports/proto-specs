[versions]
protobuf = "4.34.0"
protobuf-gradle = "0.9.6"
grpc = "1.79.0"
grpc-kotlin-stub = "1.5.0"
kotlin = "2.3.10"
javax-annotations = "1.3.2"

[libraries]
protobuf-kotlin = { module = "com.google.protobuf:protobuf-kotlin", version.ref = "protobuf" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protobuf-compiler = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }

grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-kotlin-stub = { module = "io.grpc:grpc-kotlin-stub", version.ref = "grpc-kotlin-stub" }
grpc-java-generator = { module = "io.grpc:protoc-gen-grpc-java", version.ref = "grpc" }
grpc-kotlin-generator = { module = "io.grpc:protoc-gen-grpc-kotlin", version.ref = "grpc" }

javax-annotations = { module = "javax.annotation:javax.annotation-api", version.ref = "javax-annotations"}

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-gradle" }
